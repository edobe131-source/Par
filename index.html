<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Par</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="game" width="960" height="540"></canvas>

    <!-- 월드 선택 -->
    <section id="screen-select" class="screen">
      <h1 class="logo">PAR</h1>
      <p class="subtitle">월드를 선택하세요</p>
      <div id="world-list" class="world-list"></div>
    </section>

    <!-- 플레이 HUD -->
    <div id="hud-play" class="hud hidden">
      <span id="play-title" class="badge"></span>
      <span id="play-stars" class="badge stars"></span>
      <span class="spacer"></span>
      <button id="btn-checkpoints" type="button">체크포인트 <kbd>C</kbd></button>
      <button id="btn-dev" type="button">개발자</button>
      <button id="btn-play-exit" type="button">월드 선택</button>
    </div>
    <div id="hint-play" class="statusbar hidden">
      <span>←→ / A D 이동 · Space / ↑ / W 점프 · C 체크포인트 이동 · R 체크포인트로 · Esc 월드 선택</span>
    </div>

    <!-- 에디터 툴바 -->
    <div id="hud-editor" class="hud hidden">
      <span id="editor-title" class="badge"></span>
      <span class="spacer"></span>
      <button id="btn-test" type="button">테스트 <kbd>P</kbd></button>
      <button id="btn-save" type="button">저장 <kbd>Ctrl+S</kbd></button>
      <button id="btn-mapstr" type="button">맵 문자열</button>
      <button id="btn-editor-exit" type="button">나가기</button>
    </div>
    <aside id="editor-panel" class="panel hidden">
      <div class="panel-section">
        <div class="panel-title">도구</div>
        <div id="palette-tools" class="palette-grid"></div>
      </div>
      <div class="panel-section grow">
        <div class="panel-head">
          <span class="panel-title">블록 디자인</span>
          <button id="btn-design-new" type="button" class="small">+ 새로</button>
        </div>
        <div id="palette-designs"></div>
      </div>
      <div id="spike-pos" class="panel-section hidden">
        <div class="panel-title">단일 가시 위치 <kbd>Q</kbd></div>
        <div class="seg">
          <button type="button" data-pos="0">왼쪽</button>
          <button type="button" data-pos="1">가운데</button>
          <button type="button" data-pos="2">오른쪽</button>
        </div>
      </div>
      <div class="panel-actions">
        <button id="btn-design-edit" type="button" class="small">편집</button>
        <button id="btn-design-dup" type="button" class="small">복제</button>
        <button id="btn-design-del" type="button" class="small">삭제</button>
      </div>
    </aside>
    <div id="hint-editor" class="statusbar hidden">
      <span id="editor-status"></span>
      <span class="spacer"></span>
      <span id="editor-help">좌클릭 놓기 · 우클릭 지우기 · Alt+클릭 집기 · WASD/방향키/휠/가운데 버튼 드래그 이동</span>
    </div>

    <!-- 체크포인트 이동 -->
    <div id="modal-cp" class="modal hidden">
      <div class="modal-box">
        <h2>체크포인트 이동</h2>
        <p id="cp-msg" class="desc"></p>
        <div id="cp-list" class="cp-list"></div>
        <div class="row">
          <button type="button" data-close>닫기</button>
        </div>
      </div>
    </div>

    <!-- 개발자 인증 -->
    <div id="modal-auth" class="modal hidden">
      <form id="form-auth" class="modal-box">
        <h2>개발자 인증</h2>
        <input id="auth-code" type="password" autocomplete="off" placeholder="인증 코드">
        <p id="auth-error" class="error"></p>
        <div class="row">
          <button type="button" data-close>취소</button>
          <button type="submit" class="primary">확인</button>
        </div>
      </form>
    </div>

    <!-- 맵 문자열 보기 / 붙여넣기 -->
    <div id="modal-mapstr" class="modal hidden">
      <div class="modal-box wide">
        <h2>맵 문자열</h2>
        <p class="desc">현재 맵(블록 디자인 포함)을 하나의 문자열로 나타낸 것입니다. 다른 문자열을 붙여넣고 적용하면 맵이 바뀝니다.</p>
        <textarea id="mapstr-text" spellcheck="false"></textarea>
        <p id="mapstr-msg" class="error"></p>
        <div class="row">
          <button type="button" id="mapstr-default" class="left">기본 맵 불러오기</button>
          <button type="button" data-close>닫기</button>
          <button type="button" id="mapstr-copy">복사</button>
          <button type="button" id="mapstr-apply" class="primary">적용</button>
        </div>
      </div>
    </div>

    <!-- 블록 디자인 편집 -->
    <div id="modal-design" class="modal hidden">
      <div class="modal-box design-box">
        <h2 id="design-title">디자인 편집</h2>
        <label id="design-type-row" class="type-row">종류 <select id="design-type"></select></label>
        <div class="design-body">
          <canvas id="design-grid" width="256" height="256"></canvas>
          <div class="design-side">
            <canvas id="design-preview" width="176" height="96"></canvas>
            <div class="color-row">
              <input id="design-color" type="color" value="#ffffff">
              <button id="design-transparent" type="button" class="small">투명</button>
              <button id="design-fill" type="button" class="small">전체 채우기</button>
            </div>
            <div id="design-swatches" class="swatches"></div>
          </div>
        </div>
        <p class="desc">좌클릭 칠하기 · 우클릭 투명 · 빗금 칸은 모양 밖이라 투명으로 고정</p>
        <div class="row">
          <button type="button" data-close>취소</button>
          <button type="button" id="design-save" class="primary">저장</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/sha256.js"></script>
  <script src="js/map.js"></script>
  <script src="js/designs.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/worlds.js"></script>
  <script src="js/input.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/render.js"></script>
  <script src="js/play.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/editor-panel.js"></script>
  <script src="js/design-dialog.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

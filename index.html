<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Par 동작 확인</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #f4f5f7;
      color: #222;
    }
    main {
      text-align: center;
      padding: 2rem;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    #clock { font-size: 2rem; margin: 1rem 0; font-variant-numeric: tabular-nums; }
    button { font-size: 1rem; padding: 0.6rem 1.2rem; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>잘 동작합니다 ✅</h1>
    <div id="clock"></div>
    <button id="btn">클릭: <span id="count">0</span></button>
  </main>
  <script>
    const clock = document.getElementById('clock');
    const tick = () => { clock.textContent = new Date().toLocaleTimeString('ko-KR'); };
    tick();
    setInterval(tick, 1000);

    let count = 0;
    document.getElementById('btn').addEventListener('click', () => {
      document.getElementById('count').textContent = ++count;
    });
  </script>
</body>
</html>
